<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Segmented control demo</title>
  <style>
    .page { display: grid; gap: 20px; max-width: 560px; margin: 0 auto; padding: 24px 16px; }
    .page h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .controls button { height: 32px; padding: 0 12px; border: 1px solid var(--tray-line); border-radius: var(--radius-sm); background: var(--tray); color: var(--tray-text); font-size: 13px; }
    .controls button[aria-pressed='true'] { box-shadow: inset 0 0 0 1px var(--tray-text); }
    .note { margin: 0; color: var(--tray-muted); font-size: 13px; }
    .demos { display: grid; gap: 20px; }
    .demo h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
    .tray-surface { background: var(--tray); color: var(--tray-text); padding: 16px; border-radius: var(--radius-md); box-shadow: var(--popover-shadow); }
    .tray-surface.w320 { width: 320px; max-width: 100%; box-sizing: border-box; }
    .tracker-card { background: var(--trk-ground); color: var(--trk-text); padding: 12px; border-radius: var(--radius-md); box-shadow: var(--object-shadow); }
    .status { margin: 8px 0 0; color: var(--tray-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .seg-icon { display: inline-grid; place-items: center; width: 16px; height: 16px; }
    .seg-icon svg { display: block; }
  </style>
</head>
<body>
  <main class="page">
    <h1>Segmented control</h1>
    <div class="controls">
      <div id="themes" class="controls" role="group" aria-label="Theme"></div>
      <button type="button" id="dir" aria-pressed="false">dir=ltr</button>
    </div>
    <p class="note">Hold Space and arrows to test keyboard (instant); click or drag the marker (animated).</p>
    <div id="demos" class="demos"></div>
  </main>
  <script type="module" src="/src/segmented-demo.ts"></script>
</body>
</html>
