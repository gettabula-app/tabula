apiVersion: 1
# Both datasources are internal to the compose network. VictoriaMetrics speaks the Prometheus API (and MetricsQL).
datasources:
  - name: Tabula metrics
    uid: tabula-vm
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 1h
  - name: Tabula logs
    uid: tabula-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 500
