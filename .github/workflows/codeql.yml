name: CodeQL

on:
  # Not on every push to main: a run takes 20 to 38 minutes and the next push cancelled 20 of the last 25 of them before they finished, so it only
  # held a runner. It runs on pull requests, every night on main, and on request (workflow_dispatch, for example on a release SHA).
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
