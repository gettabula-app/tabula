name: CI

# A push that only touches Markdown, docs/, design/ mockups, licence files or dependabot.yml starts no run at all, so it
# cannot cancel a code run in progress through the concurrency group below. A push that changes the user guide is built
# by docs.yml. Fragment-only pushes to main are also ignored by `**.md`; main receives fragments with their code change.
# Pull requests have no paths filter on purpose: a workflow that never starts reports nothing, so "CI passed" could wait
# forever as a required check. Every pull request starts a run and the "changes" job decides what it needs.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'design/**', 'LICENSE*', '.github/dependabot.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      full-matrix:
        description: 'Run the full matrix (Linux, macOS and Windows on every Node version) instead of Linux only'
        type: boolean
        default: false
  # release.yml (a v* tag, or by hand) runs these gates before it builds and pushes the image. A tag no longer starts CI by itself:
  # the release workflow calls it, so the gates run once per tag, and the Docker job below still publishes the semver tags to ghcr.
  # The release passes full-matrix: true, so the SHA that is released has always run on all three systems.
  workflow_call:
    inputs:
      full-matrix:
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run in progress, so a burst
# of commits only builds the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  # Sorts the change with scripts/ci-changes.mjs, the same ignore set as the push filter above. code: something outside
  # it changed, so the full pipeline runs. guide: something under docs/guide/ or docs/images/ changed. A pull request is compared with
  # the point where it branched off its base, a push with the commit before it (and the push filter has normally kept
  # the docs-only ones out already). Tags, manual runs, new branches, force pushes and any diff that fails count as
  # code, so a doubt builds everything.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      guide: ${{ steps.classify.outputs.guide }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        # bash with pipefail, so a failing script fails the job instead of leaving empty outputs that skip everything
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          FORCED: ${{ github.event.forced }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          range=
          if [ "$EVENT" = pull_request ]; then
            range="$BASE...$HEAD"
          elif [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ] && [ "$FORCED" != true ] && [ -n "${BEFORE//0/}" ]; then
            range="$BEFORE..$AFTER"
          fi
          if [ -n "$range" ] && files=$(git -c core.quotepath=off diff --name-only --no-renames "$range"); then
            echo "Changed in $range:"
            echo "$files" | awk '{ print "  " $0 }'
            printf '%s\n' "$files" | node scripts/ci-changes.mjs | tee -a "$GITHUB_OUTPUT"
          else
            echo "No usable range to compare, so everything runs"
            printf 'code=true\nguide=true\n' | tee -a "$GITHUB_OUTPUT"
          fi
      # Every push and pull request tests on Linux only (Node 24, which also runs the browser tests, and Node 26, the Node the Docker image ships).
      # The full matrix (Linux with Node 22, 24 and 26, macOS, and Windows in two shards) runs for a release, on request (workflow_dispatch with
      # full-matrix) and in nightly.yml. Windows and macOS path and timing differences therefore show up at the latest on the release SHA.
      - id: matrix
        shell: bash
        env:
          FULL: ${{ inputs.full-matrix }}
        run: |
          if [ "$FULL" = true ]; then
            matrix='{"include":[{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":24},{"os":"ubuntu-latest","node":26},{"os":"macos-latest","node":22},{"os":"macos-latest","node":24},{"os":"macos-latest","node":26},{"os":"windows-latest","node":22,"shard":"1/2"},{"os":"windows-latest","node":22,"shard":"2/2"},{"os":"windows-latest","node":24,"shard":"1/2"},{"os":"windows-latest","node":24,"shard":"2/2"},{"os":"windows-latest","node":26,"shard":"1/2"},{"os":"windows-latest","node":26,"shard":"2/2"}]}'
          else
            matrix='{"include":[{"os":"ubuntu-latest","node":24},{"os":"ubuntu-latest","node":26}]}'
          fi
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

  quality:
    name: Lint, typecheck & audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run changelog:check
      - run: npm run typecheck
      - run: npm audit --audit-level=high

  # Windows runs the tests in two shards (vitest --shard): its jobs took 3 to 6 minutes and growing with two workers on a
  # shared runner, and the relay tests time out when they starve it (TAB-180). The other systems run one job per node
  # version, as before. The app build runs once per node version, in the first Windows shard.
  test:
    name: Test & build (${{ matrix.os }}, node ${{ matrix.node }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    # The Linux node 24 leg also installs Chromium and runs the browser tests, which add a few minutes (see docs/testing.md, "Browser tests in CI").
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 && 20 || 15 }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Browser tests (Playwright Chromium) run on this one leg only: they skip cleanly where Chromium is absent, so every other leg stays as it was.
      # The key holds the lockfile hash, and the lockfile pins the Playwright version, so a new Playwright downloads a new browser.
      - name: Cache Playwright browsers
        id: playwright-cache
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # --with-deps installs the system libraries a fresh runner lacks; the cache only saves the browser download
      - name: Install Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npx playwright install --with-deps chromium
      # vitest also writes a JSON report, so every job ends with its slowest test files and keeps the times (TAB-201)
      - run: npm test -- --reporter=default --reporter=json --outputFile.json=test-results.json
        if: ${{ !matrix.shard }}
      - run: npm test -- --shard=${{ matrix.shard }} --reporter=default --reporter=json --outputFile.json=test-results.json
        if: ${{ matrix.shard }}
      # A browser test that skipped because Chromium went missing would stay green: fail this leg if any browser test file passed nothing
      - name: Browser tests really ran
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24 && !cancelled()
        run: node scripts/check-browser-tests.mjs test-results.json
      - name: Slowest test files
        if: ${{ !cancelled() }}
        # On the Windows shards, the slowest platform, a single test over its limit in test/timing-budget.json fails the job
        run: node scripts/test-timings.mjs test-results.json --top 15 ${{ matrix.shard && '--budget test/timing-budget.json' || '' }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-times-${{ matrix.os }}-node${{ matrix.node }}-${{ strategy.job-index }}
          path: test-results.json
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run build:app
        if: ${{ matrix.shard != '2/2' }}
      # the icon sets are built once, where the dist artifact is made, and again in the Docker build
      - run: npm run build:icons
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, quality, test]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Keep the with: inputs here and in the retry step identical.
      - uses: docker/build-push-action@v7
        id: build
        continue-on-error: true
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Wait before retrying the image build
        if: steps.build.outcome == 'failure'
        run: sleep 90
      - uses: docker/build-push-action@v7
        id: build-retry
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fail the job if the image build has failed on both attempts.
      - name: Fail if the image build retry failed
        if: steps.build.outcome == 'failure' && steps.build-retry.outcome != 'success'
        run: exit 1

  # The guide is built into the app and the Docker image. When a pull request changes only the guide (no code), the jobs
  # above are skipped and this builds and tests it on one runner. When code changed too, the full matrix already covers
  # it. Pushes to main get the same check from docs.yml.
  docs:
    name: User guide build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.guide == 'true' && needs.changes.outputs.code != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx vitest run test/docs-markdown.test.ts test/docs-relay.test.ts test/sw-docs.test.ts
      - run: npm run build:app

  # The one check to require: skipped jobs count as passed, a failed or cancelled one does not.
  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, quality, test, docker, docs]
    steps:
      - name: Fail if a required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All required jobs passed
        run: echo "All CI jobs passed"
