name: Secret scan

# Scans the whole history for credentials with gitleaks and .gitleaks.toml. It has no paths filter on purpose: a docs-only push can
# carry a key as well as a code push can. It runs on pushes to main, on every pull request and by hand. The binary is a pinned
# release whose sha256 is checked before it is unpacked (the checksum is the one in gitleaks_8.30.1_checksums.txt, linux_x64).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the history
        # --redact keeps a finding's value out of the log. A finding fails the job.
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml --exit-code 1 .
