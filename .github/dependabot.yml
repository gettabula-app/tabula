version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # icon sets publish often and a bump can rename an icon, so it gets its own pull request
      icon-sets:
        patterns:
          - '@iconify/json'
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - '@iconify/json'
        update-types:
          - minor
          - patch
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
